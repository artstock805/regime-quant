<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX 상황판</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b24; --panel2:#1b222d; --line:#232b38;
    --fg:#e6edf3; --dim:#8b98a9; --faint:#5c6875;
    --up:#3fb950; --down:#f85149; --accent:#58a6ff; --warn:#d29922;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
       font:13px/1.5 "Malgun Gothic","Segoe UI",system-ui,sans-serif}
  a{color:var(--accent);text-decoration:none}

  /* 화면 전체를 쓴다. 차트가 주인공이라 스크롤로 밀려나면 안 된다. */
  .app{display:grid;height:100vh;
       grid-template-rows:44px auto 1fr var(--histh, 236px);
       grid-template-columns:1fr 330px;
       grid-template-areas:"top top" "strip strip" "chart side" "hist side";}
  .app.hist-min{--histh:33px}
  @media(max-width:1000px){
    .app{grid-template-columns:1fr;
         grid-template-rows:44px auto 55vh var(--histh, 236px) auto;
         grid-template-areas:"top" "strip" "chart" "hist" "side";overflow:auto}
    body{overflow:auto}
  }

  /* ── 상단 ── */
  .top{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 14px;
       border-bottom:1px solid var(--line);background:var(--panel)}
  .top .brand{font-weight:700;font-size:13.5px}
  .top .acct{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  .chip{background:#1c2532;border:1px solid var(--line);border-radius:999px;
        padding:2px 9px;font-size:11px;color:var(--dim)}
  .chip.demo{background:#12251a;border-color:#245c33;color:#7ee89b}
  .chip.real{background:#3a1010;border-color:#7a2020;color:#ff9a9a}
  .top nav{margin-left:auto;display:flex;gap:5px}
  .top nav a{padding:4px 11px;border-radius:7px;border:1px solid var(--line);
             font-size:12px;color:var(--dim)}
  .top nav a.on{background:var(--panel2);color:var(--fg);border-color:#3a4757}

  /* ── 통화쌍 띠 ── */
  .strip{grid-area:strip;display:flex;gap:7px;padding:9px 14px;overflow-x:auto;
         border-bottom:1px solid var(--line);background:#11161e}
  .strip::-webkit-scrollbar{height:6px}
  .strip::-webkit-scrollbar-thumb{background:#2a3340;border-radius:3px}
  .pair{flex:none;min-width:132px;cursor:pointer;background:var(--panel);
        border:1px solid var(--line);border-radius:9px;padding:7px 10px;
        transition:.12s}
  .pair:hover{border-color:#3a4757}
  .pair.on{border-color:var(--accent);background:#12202c}
  .pair.holding{border-left:3px solid var(--up)}
  .pair .nm{font-weight:700;font-size:12.5px;display:flex;gap:6px;align-items:center}
  .pair .px{font-variant-numeric:tabular-nums;font-size:13px;margin-top:2px}
  .pair .sub{color:var(--faint);font-size:10.5px;margin-top:2px;
             font-variant-numeric:tabular-nums}
  .cost-good{color:var(--up)} .cost-mid{color:var(--warn)} .cost-bad{color:var(--down)}

  /* ── 차트 ── */
  .chart{grid-area:chart;position:relative;background:#0b0f15}
  #tv{position:absolute;inset:0}
  .chartnote{position:absolute;left:10px;bottom:8px;z-index:5;
             background:#0d1117d9;border:1px solid var(--line);border-radius:7px;
             padding:5px 10px;font-size:11px;color:var(--faint);max-width:calc(100% - 20px)}

  /* ── 매매 내역 (차트 아래) ── */
  .hist{grid-area:hist;border-top:1px solid var(--line);background:var(--panel);
        display:flex;flex-direction:column;min-height:0}
  .histbar{display:flex;align-items:center;gap:10px;padding:6px 12px;
           border-bottom:1px solid var(--line);flex:none;font-size:11.5px}
  .histbar b{font-size:11px;color:var(--dim);letter-spacing:.6px;
             text-transform:uppercase}
  .histbar .sum{color:var(--faint);font-variant-numeric:tabular-nums}
  .histbar .sum em{font-style:normal;color:var(--dim)}
  .histbar .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  .histwrap{overflow:auto;min-height:0;flex:1}
  .app.hist-min .histwrap{display:none}
  table.hist{width:100%;border-collapse:collapse;font-size:11.5px;
             font-variant-numeric:tabular-nums}
  table.hist th{position:sticky;top:0;background:#131922;color:var(--faint);
                font-weight:600;text-align:right;padding:5px 9px;
                border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
  table.hist th:first-child,table.hist td:first-child{text-align:left}
  table.hist th.l,table.hist td.l{text-align:left}
  table.hist td{padding:4px 9px;text-align:right;border-bottom:1px solid #1a212b;
                white-space:nowrap}
  table.hist tr.fx{cursor:pointer}
  table.hist tr.fx:hover td{background:#182230}
  table.hist tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  .src{font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);
       color:var(--faint)}
  .src.mine{color:#9ecbff;border-color:#2d4a6b;background:#132234}
  /* 등록 안 된 magic. **눈에 띄어야 한다** — 새 앱이 계좌에 붙었다는 뜻이고,
     모른 채로 두면 그 거래가 조용히 남의 칸에 섞인다. */
  .src.unknown{color:#e0b35c;border-color:#5a4520;background:#2a2111}

  /* ── 앱별 성적 ──
     이 계좌에는 여러 앱이 동시에 주문을 낸다. '엔진/수동' 두 칸으로만 가르면
     남의 봇 거래가 전부 "수동"에 쌓이고, 그걸 사람 손거래로 읽게 된다.
     실제로 그렇게 읽고 틀린 진단을 냈다. 그래서 **앱을 따로 세운다.** */
  .srcbar{display:flex;flex-wrap:wrap;gap:6px;padding:7px 12px;
          border-bottom:1px solid #1a212b}
  .srcbar:empty{display:none}
  .srcchip{display:flex;align-items:baseline;gap:6px;font-size:11px;
           padding:3px 9px;border:1px solid var(--line);border-radius:6px;
           background:#121821;cursor:pointer}
  .srcchip:hover{border-color:#2d4a6b}
  .srcchip.on{border-color:var(--accent);background:#132234}
  .srcchip b{font-weight:600;color:var(--fg)}
  .srcchip .n{color:var(--faint)}

  /* ── 잔고 요약 (한눈에 보는 것이 목적이다) ──
     실거래를 대비해 **위험을 먼저 보이게** 배치한다. 숫자 아홉 개를 같은
     크기로 나열하면 무엇이 중요한지가 안 보인다. 평가액을 크게, 그 아래
     오늘 손익, 그다음 한도까지 얼마나 남았는지를 막대로 둔다. */
  .bigeq{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;
         letter-spacing:-.5px;line-height:1.15}
  .bigcur{font-size:13px;color:var(--dim);font-weight:400;margin-left:4px}
  .bigsub{font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:2px}
  .live{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;
        border-radius:999px;vertical-align:2px;margin-left:6px}
  .live.demo{background:#12251a;border:1px solid #245c33;color:#7ee89b}
  /* **실계좌는 눈에 확 띄어야 한다.** 데모와 같은 모양이면 착각한다. */
  .live.real{background:#4a0d0d;border:1px solid #c0392b;color:#ff8a80}
  .gauge{margin:9px 0 3px}
  .gauge .lbl{display:flex;justify-content:space-between;font-size:11px;
              color:var(--dim);margin-bottom:3px}
  .gauge .lbl b{font-variant-numeric:tabular-nums;color:var(--fg)}
  .gbar{height:7px;border-radius:4px;background:#222b37;overflow:hidden}
  .gbar i{display:block;height:100%;border-radius:4px;transition:width .3s}
  .g-ok{background:var(--up)} .g-warn{background:var(--warn)}
  .g-bad{background:var(--down)}
  .gnote{font-size:10.5px;color:var(--faint);margin-top:3px}
  .kvs{margin-top:9px;border-top:1px solid var(--line);padding-top:7px}
  details.more{margin-top:7px}
  details.more summary{font-size:11px;color:var(--faint);cursor:pointer;
                       list-style:none;user-select:none}
  details.more summary::-webkit-details-marker{display:none}
  details.more summary:hover{color:var(--dim)}

  /* ── 잔고 곡선 ── */
  .spark{width:100%;height:36px;display:block;margin:8px 0 2px}
  .sparknote{font-size:10.5px;color:var(--faint);text-align:right}

  /* ── 오른쪽 ── */
  .side{grid-area:side;overflow-y:auto;border-left:1px solid var(--line);
        background:var(--panel);padding:12px}
  .side h3{font-size:11px;margin:0 0 9px;color:var(--dim);letter-spacing:.6px;
           text-transform:uppercase;font-weight:700}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
        padding:11px 13px;margin-bottom:11px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;
      border-bottom:1px dashed #232b38;font-size:12.5px}
  .kv:last-child{border-bottom:0}
  .kv span:first-child{color:var(--dim)}
  .kv span:last-child{font-variant-numeric:tabular-nums}
  .pos{color:var(--up)} .neg{color:var(--down)}
  .empty{color:var(--faint);font-size:12px;padding:6px 0}
  .errbox{background:#1d1213;border:1px solid #5c2424;border-radius:9px;
          padding:10px 12px;font-size:12px;color:#ff9a9a;white-space:pre-wrap;
          margin-bottom:11px}
  .btn{background:#1c222b;border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer;
    font-family:inherit}
  .btn:hover{background:#243040}
  .btn.go{background:#16351f;border-color:#2c6b3d}
  .btn.go:hover{background:#1d4527}
  .btn.stop{background:#331a1a;border-color:#6b2c2c}
  .btn.stop:hover{background:#452020}
  .btn:disabled{opacity:.4;cursor:default}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .verdict{background:#1d1a12;border:1px solid #4a3a12;border-radius:9px;
    padding:10px 12px;font-size:12px;line-height:1.6;margin-bottom:10px}
  .verdict b{color:#e0b341}
  .enginerow{display:flex;justify-content:space-between;align-items:center;
    font-size:12px;padding:3px 0}
  .enginerow .k{color:var(--faint)}
  .warnbox{background:#1d1a12;border:1px solid #4a3a12;border-radius:9px;
           padding:10px 12px;font-size:11.5px;color:#c9b070;margin-bottom:11px}
  .poscard{border-left:3px solid var(--line);padding-left:9px;margin-bottom:9px;
           cursor:pointer}
  .poscard.long{border-left-color:var(--up)}
  .poscard.short{border-left-color:var(--down)}
  .poscard.nofx{cursor:default;opacity:.7}
  .poscard .h{display:flex;gap:7px;align-items:baseline;font-size:12.5px}
  .poscard .h b{font-size:13px}
  .poscard .d{color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}

  /* ── 유튜브 전략 ── */
  .ytform{display:flex;gap:6px}
  .ytform input{flex:1;min-width:0;background:#0f141b;border:1px solid var(--line);
                border-radius:7px;color:var(--fg);padding:5px 8px;font:inherit}
  .ytform input:focus{outline:none;border-color:var(--accent)}
  .ytopt{display:block;margin:6px 0 4px;font-size:11px;color:var(--faint);cursor:pointer}
  .ytopt input{vertical-align:-2px}
  details.yt{border-top:1px solid var(--line);padding:6px 0}
  details.yt summary{display:flex;align-items:center;gap:7px;cursor:pointer;
                     list-style:none}
  details.yt summary::-webkit-details-marker{display:none}
  details.yt summary b{flex:1;min-width:0;font-size:12px;overflow:hidden;
                       text-overflow:ellipsis;white-space:nowrap}
  .ytst{flex:none;font-size:10.5px;color:var(--faint)}
  .ytst.on{color:var(--up)}
  .ytst.warn{color:var(--warn)}
  .ytst.bad{color:var(--down)}
  .ytyears{display:flex;flex-wrap:wrap;gap:2px 8px;margin:3px 0;font-size:10.5px;
           font-variant-numeric:tabular-nums}
  .ytbody .pos{color:var(--up)} .ytbody .neg{color:var(--down)}
  .ytbody{margin-top:7px;font-size:11.5px;line-height:1.55}
  .ytbody .warnbox{margin:0 0 4px}
  .ytk{color:var(--dim);font-size:10.5px;margin-top:7px}
  .ytbody code{display:block;background:#0f141b;border:1px solid var(--line);
               border-radius:6px;padding:5px 7px;white-space:pre-wrap;
               word-break:break-word;font:11px/1.5 Consolas,monospace}
  .ytbody ul{margin:2px 0 0;padding-left:16px}
  .ytnote{margin-top:8px;font-size:10.5px;color:var(--faint);line-height:1.5}

  /* ── 감시 통화쌍 ── */
  .wlnames{font-size:11.5px;line-height:1.7;color:var(--dim);word-spacing:1px}
  .wlgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 6px}
  .wlgrid label{font-size:11.5px;cursor:pointer;white-space:nowrap;
                font-variant-numeric:tabular-nums}
  .wlgrid input{vertical-align:-2px}
  .wlgrid .cost{color:var(--faint);font-size:10px}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <span class="brand">FX 상황판</span>
    <span class="chip" id="conn">연결 확인 중</span>
    <span class="acct" id="acct"></span>
    <nav>
      <a href="/" class="on">FX 상황판</a>
      <a href="/review">복기</a>
    </nav>
  </div>

  <div class="strip" id="strip"></div>

  <div class="chart">
    <div id="tv"></div>
    <div class="chartnote" id="chartnote"></div>
  </div>

  <div class="hist">
    <div class="histbar">
      <b>매매 내역</b>
      <span class="sum" id="histsum">읽는 중…</span>
      <span class="right">
        <label style="color:var(--faint);cursor:pointer">
          <input type="checkbox" id="onlyours" style="vertical-align:-1px">
          엔진 거래만
        </label>
        <select id="histdays" class="btn" style="padding:3px 6px">
          <option value="7">7일</option>
          <option value="30" selected>30일</option>
          <option value="90">90일</option>
          <option value="365">1년</option>
        </select>
        <button class="btn" id="histcsv" style="padding:3px 9px">CSV</button>
        <button class="btn" id="histtoggle" style="padding:3px 9px">접기</button>
      </span>
    </div>
    <div class="srcbar" id="histsrc"></div>
    <div class="histwrap" id="histwrap">
      <div class="empty" style="padding:10px 12px">읽는 중…</div>
    </div>
  </div>

  <div class="side">
    <div id="alerts"></div>

    <div class="card">
      <h3>계좌 <span style="text-transform:none;color:var(--faint);
        font-weight:400" id="acctkind"></span></h3>
      <div id="account"><div class="empty">확인 중…</div></div>
    </div>

    <div class="card">
      <h3>엔진 누적 R</h3>
      <div id="rcurve"><div class="empty">확인 중…</div></div>
    </div>

    <div class="card">
      <h3>자동매매</h3>
      <div id="engine"><div class="empty">확인 중…</div></div>
    </div>

    <div class="card">
      <h3>단기 자동매매 <span style="text-transform:none;color:var(--faint);
        font-weight:400">1시간봉 미만 전략</span></h3>
      <div id="shortengine"><div class="empty">확인 중…</div></div>
    </div>

    <div class="card">
      <h3>유튜브 전략 <span style="text-transform:none;color:var(--faint);
        font-weight:400">투표 후보</span></h3>
      <div id="ytkey"></div>
      <div class="ytform">
        <input id="yturl" type="url" placeholder="유튜브 영상 URL" autocomplete="off"
               onkeydown="if (event.key === 'Enter') ytExtract()">
        <button class="btn go" id="ytgo" onclick="ytExtract()">분석</button>
      </div>
      <label class="ytopt"><input type="checkbox" id="ytover">
        같은 이름이 있으면 덮어쓰기</label>
      <div id="ytmsg"></div>
      <div id="ytlist"><div class="empty">확인 중…</div></div>
      <div class="ytnote">켠 전략은 엔진의 다음 바퀴부터 투표합니다. 발언권은 최근
        학습 구간 성적이 정하고, 거래가 적거나 기대 R 이 0 이하면 0 입니다.</div>
    </div>

    <div class="card">
      <h3>감시 통화쌍 <span style="text-transform:none;color:var(--faint);
        font-weight:400" id="wlsum"></span></h3>
      <div id="watchlist"><div class="empty">확인 중…</div></div>
    </div>

    <div class="card">
      <h3>포지션 <span style="text-transform:none;color:var(--faint);
        font-weight:400">MT5 실제</span></h3>
      <div id="positions"><div class="empty">열린 포지션이 없습니다.</div></div>
    </div>

    <div class="card">
      <h3>선택 종목</h3>
      <div id="detail"><div class="empty">통화쌍을 고르세요.</div></div>
    </div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const $ = s => document.querySelector(s);

// 서버에서 온 문자열을 그대로 innerHTML 에 넣지 않는다. 브로커 이름·오류
// 문구가 어디서 왔는지 우리가 다 통제하지 못한다.
const esc = v => String(v ?? "").replace(/[&<>"']/g,
  c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;",
         '"': "&quot;", "'": "&#39;"}[c]));
let widget = null, shown = null, quotes = [], provider = "FX_IDC";
let holding = new Set(), timer = null, tick = 0;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.detail || r.status);
  return b;
}

/* ───────── 차트 ─────────
   트레이딩뷰 위젯이 화면의 주인공이다. 종목이 바뀔 때만 다시 만든다 —
   매 갱신마다 새로 만들면 차트가 깜빡이고 사용자가 그려 둔 것이 사라진다. */
function showChart(tvSymbol, interval = "60") {
  if (shown === tvSymbol) return;
  shown = tvSymbol;
  $("#tv").innerHTML = "";
  widget = new TradingView.widget({
    container_id: "tv", autosize: true,
    symbol: tvSymbol, interval, timezone: "Asia/Seoul",
    theme: "dark", style: "1", locale: "kr",
    toolbar_bg: "#0d1117", hide_side_toolbar: false,
    allow_symbol_change: false,          // 종목은 아래 띠에서 고른다
    withdateranges: true, details: false,
    // **보조지표를 걸지 않는다.**
    //
    // 전에는 RSI 와 단순이동평균이 걸려 있었는데, 성과 근거가 있어서가 아니라
    // 위젯 기본값이라서 들어간 것이었다. 그리고 그 둘은 엔진이 보는 것과도
    // 무관하다 — 엔진은 볼린저·돈치안·ADX·켈트너·VWAP 등 11개 전략의 가중
    // 합산으로 판단한다. 화면과 판단이 다르면 사람이 둘을 섞어 읽는다.
    //
    // 더 큰 이유는 측정 결과다. 여덟 번의 독립 측정에서 지표로 방향을 맞추는
    // 것이 한 번도 우연과 구분되지 않았고, 특히 |IC| 상위였던 변동성·평균회귀
    // 지표들은 **지수가 장기 우상향한다는 사실 하나**를 재고 있었다
    // (지수 15/15 일치, FX 에서는 정확히 0 — scripts/screen_mt5_features.py).
    // 근거 없는 지표를 띄워 두면 그걸 보고 판단하고 싶어진다.
    //
    // 엔진의 판단은 오른쪽 패널에 숫자로 나온다. 차트는 캔들만 둔다.
  });
}

/* ───────── 통화쌍 띠 ───────── */
function costClass(v) {
  if (v == null) return "";
  return v <= 5 ? "cost-good" : v <= 10 ? "cost-mid" : "cost-bad";
}

function renderStrip() {
  $("#strip").innerHTML = quotes.map(q => {
    const cur = q.canonical === (window.__focus || "");
    const hold = holding.has(q.mt5);
    const px = q.bid != null ? q.bid.toFixed(q.digits ?? 5) : "—";
    return `<div class="pair ${cur ? "on" : ""} ${hold ? "holding" : ""}"
              data-sym="${q.canonical}">
      <div class="nm">${q.display}${hold ? ' <span style="color:var(--up)">●</span>' : ""}</div>
      <div class="px">${px}</div>
      <div class="sub">스프레드 ${q.spread_pips ?? "—"}핍 ·
        <span class="${costClass(q.cost_over_r_pct)}">비용 ${q.cost_over_r_pct ?? "—"}%</span></div>
    </div>`;
  }).join("");
  document.querySelectorAll(".pair").forEach(el => {
    el.onclick = async () => {
      const f = await api(`/api/fx/focus?symbol=${el.dataset.sym}&manual=true`,
                          {method: "POST"});
      applyFocus(f);
    };
  });
}

function applyFocus(f) {
  if (!f || !f.symbol) return;
  window.__focus = f.symbol;
  showChart(f.tradingview);
  $("#chartnote").innerHTML =
    `<b>${f.display}</b> · 차트 ${f.tradingview} (트레이딩뷰) ·
     주문 ${f.mt5} (MT5) —
     <span style="color:var(--warn)">두 시세는 제공자가 달라 몇 핍 어긋납니다.
     체결은 MT5 호가 기준입니다.</span>`;
  renderStrip();
  renderDetail();
}

function renderDetail() {
  const q = quotes.find(x => x.canonical === window.__focus);
  if (!q) { $("#detail").innerHTML = '<div class="empty">—</div>'; return; }
  $("#detail").innerHTML = [
    ["매도호가 (bid)", q.bid?.toFixed(q.digits ?? 5) ?? "—"],
    ["매수호가 (ask)", q.ask?.toFixed(q.digits ?? 5) ?? "—"],
    ["스프레드", `${q.spread_pips ?? "—"} 핍`],
    ["ATR(14)", q.atr ?? "—"],
    ["1R (손절폭)", q.one_r ?? "—"],
    ["비용 / 1R", `<span class="${costClass(q.cost_over_r_pct)}">${
      q.cost_over_r_pct ?? "—"}%</span>`],
  ].map(([k, v]) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join("");
}

/* ───────── 계좌·포지션 ───────── */
function renderStatus(s) {
  const c = $("#conn");
  if (!s.connected) {
    c.textContent = "MT5 연결 안 됨"; c.className = "chip real";
    $("#alerts").innerHTML = `<div class="errbox">${s.message}</div>`;
    $("#account").innerHTML = '<div class="empty">—</div>';
    return;
  }
  const a = s.account;
  c.textContent = a.is_demo ? "데모 계좌" : "실계좌";
  c.className = "chip " + (a.is_demo ? "demo" : "real");
  $("#acct").textContent =
    `${a.login} · ${a.server} · ${a.currency} ${a.balance.toLocaleString(undefined,
      {minimumFractionDigits:2, maximumFractionDigits:2})}`;

  const w = [];
  if (!a.trade_allowed)
    w.push(`<div class="errbox">MT5 에서 자동매매가 꺼져 있습니다.
      도구 &gt; 옵션 &gt; Expert Advisors 에서 켜세요.</div>`);
  if (!a.is_demo)
    w.push(`<div class="errbox"><b>실계좌입니다.</b> 실제 돈이 오갑니다.</div>`);
  else
    w.push(`<div class="warnbox"><b>데모 계좌</b>에서 돌고 있습니다 — 가짜 돈입니다.
      실계좌로 넘어가기 전에 여기서 충분히 돌려 보세요.</div>`);
  $("#alerts").innerHTML = w.join("");

  renderAccount(a);

  holding = new Set(s.positions.map(p => p.symbol));
  const box = $("#positions");
  if (!s.positions.length) {
    box.innerHTML = '<div class="empty">열린 포지션이 없습니다.</div>';
  } else {
    box.innerHTML = s.positions.map(p => {
      // 이 앱은 FX 전용이다. 계좌에 금·지수 포지션이 섞여 있을 수 있는데,
      // 우리 매핑으로는 차트를 못 띄우므로 그 사실을 그대로 보여 준다.
      const isFx = !!p.tradingview;
      return `<div class="poscard ${p.side === "LONG" ? "long" : "short"}
                   ${isFx ? "" : "nofx"}"
           ${isFx ? `data-sym="${(p.display ?? p.symbol).replace("/", "")}"` : ""}>
        <div class="h"><b>${p.display ?? p.symbol}</b>
          <span class="${p.side === "LONG" ? "pos" : "neg"}">${
            p.side === "LONG" ? "롱" : "숏"} ${p.volume}</span>
          <span class="${p.profit >= 0 ? "pos" : "neg"}" style="margin-left:auto">${
            p.profit >= 0 ? "+" : ""}${p.profit.toFixed(2)}</span></div>
        <div class="d">진입 ${p.entry_price} → ${p.current_price}
          ${p.stop_loss ? ` · 손절 ${p.stop_loss}` : ' · <span style="color:var(--down)">손절 없음</span>'}
          ${p.take_profit ? ` · 목표 ${p.take_profit}` : ""}
          ${isFx ? "" : ' · <span style="color:var(--faint)">FX 아님 — 이 앱이 연 것이 아닙니다</span>'}</div>
        ${(p.strategies || []).length ? `<div class="d">전략 ${stratLabel(p.strategies, p.group, true)}</div>` : ""}
      </div>`;
    }).join("");
    document.querySelectorAll(".poscard[data-sym]").forEach(el => {
      el.onclick = async () => {
        const f = await api(`/api/fx/focus?symbol=${el.dataset.sym}&manual=true`,
                            {method: "POST"});
        applyFocus(f);
      };
    });
  }
}

/* ───────── 잔고 현황 ─────────
   status(5초)는 잔고·평가액처럼 계속 움직이는 값을 준다. balance(15초)는
   실현손익·입금액·수익률처럼 천천히 바뀌는 값을 준다. 둘을 합쳐 한 카드에
   그린다 — 평가액이 5초마다 살아 움직이면서 "이게 벌어서 이렇게 된 건지"도
   같이 보이게 하려는 것이다. */
let bal = null, guardState = null, histSummary = null;

// 국면 이름. 서버는 내부 값(uptrend)을 주는데 화면은 한국어로 통일한다.
/* **이 진입을 만든 전략.** 진입은 한 전략이 아니라 투표가 정하므로 목록이다.
   서버가 기여도 큰 순으로 준다 — 첫 번째가 가장 세게 민 전략이다.
   좁은 표에서는 대표 하나와 "+N" 만 보이고, 마우스를 올리면 전부와 기여도가 나온다.
   full=true 면 전부 펼쳐 쓴다(포지션 카드).

   비어 있으면 **모른다**는 뜻이다: 남의 앱·사람이 연 거래이거나, 이 기록을 남기기
   전에 연 것이다. 지금의 가중치로 추측해 채우지 않는다. */
function stratLabel(list, group, full) {
  if (!list || !list.length) return "";
  const name = v => v.korean || v.strategy;
  const detail = list.map(v => `${name(v)} ${v.contribution >= 0 ? "+" : ""}${
    Number(v.contribution).toFixed(2)}`).join(" · ");
  const tag = group === "short" ? ' <span class="src">단기</span>' : "";
  if (full) return `${esc(detail)}${tag}`;
  const more = list.length > 1
    ? ` <span style="color:var(--faint)">+${list.length - 1}</span>` : "";
  return `<span title="${esc(detail)}">${esc(name(list[0]))}${more}</span>${tag}`;
}

const REGIME_KO = {uptrend: "상승추세", downtrend: "하락추세",
                   range: "횡보", high_vol: "고변동"};

// 가격 자릿수는 종목마다 다르다(엔 3자리, 유로 5자리, 금 2자리).
// 거래 내역에는 digits 정보가 없으므로 뒤의 0 만 떼서 원래 정밀도를 살린다.
function px(v) {
  const n = Number(v ?? 0);
  return n.toFixed(5).replace(/0+$/, "").replace(/\.$/, "");
}

function money(v, cur) {
  const n = Number(v ?? 0);
  return n.toLocaleString(undefined, {minimumFractionDigits: 2,
                                      maximumFractionDigits: 2})
         + (cur ? " " + cur : "");
}

function signed(v) {
  const n = Number(v ?? 0);
  const cls = n > 0 ? "pos" : (n < 0 ? "neg" : "");
  return `<span class="${cls}">${n > 0 ? "+" : ""}${n.toFixed(2)}</span>`;
}

function sparkline(curve) {
  // MT5 는 과거 잔고 스냅샷을 주지 않는다. 그래서 이 곡선은 **실현손익
  // 누적**이다 (미실현은 안 들어간다). 곡선이 실제 계좌 곡선인 척하면
  // 안 되므로 아래에 그렇게 적어 둔다.
  if (!curve || curve.length < 2) return "";
  const ys = curve.map(p => p.balance);
  const lo = Math.min(...ys), hi = Math.max(...ys);
  const span = (hi - lo) || 1;
  const W = 100, H = 36, pad = 3;
  const pts = curve.map((p, i) => {
    const x = (i / (curve.length - 1)) * W;
    const y = H - pad - ((p.balance - lo) / span) * (H - pad * 2);
    return `${x.toFixed(2)},${y.toFixed(2)}`;
  }).join(" ");
  const up = ys[ys.length - 1] >= ys[0];
  const col = up ? "var(--up)" : "var(--down)";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none" stroke="${col}"
                stroke-width="1.2" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="sparknote">실현손익 누적 ${curve.length}건 ·
      ${lo.toFixed(0)} ~ ${hi.toFixed(0)}</div>`;
}

function gauge(label, valueText, frac, cls, note) {
  const w = Math.max(0, Math.min(1, frac)) * 100;
  return `<div class="gauge">
    <div class="lbl"><span>${label}</span><b>${valueText}</b></div>
    <div class="gbar"><i class="${cls}" style="width:${w.toFixed(1)}%"></i></div>
    ${note ? `<div class="gnote">${note}</div>` : ""}</div>`;
}

/* 증거금 유지율 = 평가액 / 사용증거금 × 100.
   **FX 에서 강제청산을 가늠하는 단 하나의 숫자다.** XM 기준 50% 에서
   마진콜, 20% 에서 강제청산된다. 포지션이 없으면 정의되지 않는다 —
   그때 0 이나 100 을 보여 주면 거짓말이 되므로 "포지션 없음"이라고 쓴다. */
function marginLevel(eq, used) {
  if (!used || used <= 0) return null;
  return eq / used * 100;
}

function renderAccount(a) {
  $("#acctkind").textContent = "";
  const cur = a.currency;
  const eq = a.equity, unreal = a.equity - a.balance;
  const dep = bal?.funding?.deposit || 0;
  const pnl = dep ? eq - dep : null;
  const today = histSummary?.realised_today ?? null;

  // 실계좌면 배지가 빨갛게 나온다. 데모와 같은 모양이면 착각한다.
  const badge = `<span class="live ${a.is_demo ? "demo" : "real"}">${
    a.is_demo ? "데모" : "실계좌"}</span>`;

  let head = `<div class="bigeq">${money(eq, "")}<span class="bigcur">${cur}</span>
      ${badge}</div>`;
  if (pnl !== null) {
    const pct = dep ? pnl / dep * 100 : 0;
    head += `<div class="bigsub"><span class="${pnl >= 0 ? "pos" : "neg"}">${
      pnl >= 0 ? "+" : ""}${money(pnl, "")} (${pct >= 0 ? "+" : ""}${
      pct.toFixed(2)}%)</span> <span style="color:var(--faint)">입금 ${
      money(dep, "")} 대비</span></div>`;
  }

  // ── 일일 손실 한도. **엔진 가드가 실제로 쓰는 값을 그대로 보여 준다.**
  //    화면이 만든 숫자를 띄우면 가드가 막는 시점과 어긋난다.
  let gauges = "";
  const lim = guardState?.daily_loss_limit_usdt;   // 음수
  const realisedToday = guardState?.realised_today ?? today ?? 0;
  if (lim) {
    const used = Math.max(0, -Math.min(0, realisedToday));
    const frac = used / Math.abs(lim);
    gauges += gauge(
      "일일 손실 한도",
      `${money(used, "")} / ${money(Math.abs(lim), "")}`,
      frac,
      frac > 0.8 ? "g-bad" : frac > 0.5 ? "g-warn" : "g-ok",
      `한도에 닿으면 그날은 진입이 막힙니다 (잔고의 ${
        ((guardState?.limits?.daily_loss_limit ?? 0) * 100).toFixed(1)}%)`);
  }

  const ml = marginLevel(eq, bal?.margin_used ?? 0);
  if (ml === null) {
    gauges += `<div class="gauge"><div class="lbl"><span>증거금 유지율</span>
      <b style="color:var(--faint)">포지션 없음</b></div></div>`;
  } else {
    // 500% 를 가득 찬 것으로 본다. 79,000% 를 그대로 그리면 늘 100% 라
    // 위험이 다가오는 것이 안 보인다.
    const frac = Math.min(1, ml / 500);
    const cls = ml < 50 ? "g-bad" : ml < 200 ? "g-warn" : "g-ok";
    const tag = ml < 20 ? "강제청산 임박" : ml < 50 ? "마진콜 구간"
              : ml < 200 ? "주의" : "안전";
    // 8만% 같은 값은 그대로 쓰면 읽히지 않고 뜻도 없다 — 위험 구간에서
    // 한참 먼 상태라는 것만 전하면 된다.
    const shown = ml >= 1000 ? "1,000%+" : `${ml.toFixed(0)}%`;
    gauges += gauge("증거금 유지율", `${shown} · ${tag}`,
      frac, cls, "50% 마진콜 · 20% 강제청산 (XM 기준)");
  }

  const rows = [
    ["오늘 실현", today === null ? "—" : signed(today)],
    ["미실현", signed(unreal)],
    ["누적 실현", bal ? signed(bal.realised) : "—"],
  ];

  // 자주 안 보는 것은 접어 둔다. 한눈에 보는 것이 목적이므로.
  const more = [
    ["잔고", money(a.balance, cur)],
    ["사용 증거금", bal ? money(bal.margin_used, "") : "—"],
    ["여유 증거금", money(a.margin_free, "")],
    ["레버리지", `1:${a.leverage}`],
    ["건당 위험", guardState?.limits
      ? `${(guardState.limits.risk_per_trade * 100).toFixed(1)}% · 동시 ${
          guardState.limits.max_positions}종목` : "—"],
  ];

  $("#account").innerHTML = head + gauges +
    `<div class="kvs">${rows.map(([k, v]) =>
      `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join("")}</div>` +
    `<details class="more"><summary>세부 ▾</summary>${more.map(([k, v]) =>
      `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join("")}</details>` +
    (bal ? sparkline(bal.curve) : "");
}

async function refreshBalance() {
  try { bal = await api("/api/fx/balance?days=365"); }
  catch (e) { /* 잔고 부가정보가 없어도 기본 숫자는 status 가 준다 */ }
}

/* ───────── 매매 내역 ─────────
   **MT5 내역이 진실이다.** 우리 장부는 앱이 켜져 있던 동안만 안다. 손절이
   새벽에 브로커에서 터졌거나 사용자가 MT5 창에서 직접 닫으면 장부에는 아무
   줄도 없다. 그때 장부만 보여 주면 화면은 "거래 없음"이라 말하는데 잔고는
   줄어 있다 — 그게 최악이다. */

function histBlock(name, b) {
  if (!b || !b.trades) return `<em>${name}</em> 청산된 거래 없음`;
  const wr = b.win_rate === null ? "—" : (b.win_rate * 100).toFixed(0) + "%";
  const ar = b.avg_r === null || b.avg_r === undefined
             ? "" : ` · 평균 ${b.avg_r >= 0 ? "+" : ""}${b.avg_r.toFixed(2)}R`;
  const net = b.net >= 0 ? "pos" : "neg";
  // "비용 -0.95" 라고 쓰면 아꼈다는 뜻으로 읽힌다. 이 숫자의 부호는
  // **손익에 준 영향**이므로 이름을 그대로 밝힌다.
  return `<em>${name}</em> ${b.trades}건 ·
    <span class="${net}">${b.net >= 0 ? "+" : ""}${b.net.toFixed(2)}</span> ·
    승률 ${wr}${ar} · 수수료·스왑 ${b.costs.toFixed(2)}`;
}

// 지금 보고 있는 앱. 빈 문자열이면 전부.
let srcFilter = "";

function renderSources(rows) {
  /*
    **앱별 성적.** 이 계좌에는 엔진 말고도 여러 앱이 주문을 낸다.
    화면이 '엔진/수동' 두 칸으로만 가르면 남의 봇 거래가 전부 "수동"에
    쌓이는데, 그 라벨을 그대로 읽고 "손으로 연 거래에 손절이 하나도 없다"는
    진단을 냈다가 틀렸다 — 그 거래들은 손절을 거는 다른 앱 것이었다.
    숫자를 잘못 읽게 만드는 화면은 그 자체로 버그다.
  */
  const box = $("#histsrc");
  if (!rows || (rows.length <= 1 && !srcFilter)) { box.innerHTML = ""; return; }

  const chip = (key, label, b) => {
    const net = b.net >= 0 ? "pos" : "neg";
    const wr = b.win_rate === null ? "—" : (b.win_rate * 100).toFixed(0) + "%";
    // 등록 안 된 magic 은 라벨이 '미등록(magic=N)' 으로 온다. 숨기지 않는다.
    return `<span class="srcchip ${srcFilter === key ? "on" : ""}"
                  data-src="${esc(key)}" title="승률 ${wr} · 수수료·스왑 ${
             b.costs.toFixed(2)}">
      <b>${esc(label)}</b>
      <span class="n">${b.trades}건</span>
      <span class="${net}">${b.net >= 0 ? "+" : ""}${b.net.toFixed(2)}</span>
    </span>`;
  };

  const total = rows.reduce((a, r) => ({
    trades: a.trades + r.trades, net: a.net + r.net,
    costs: a.costs + r.costs, win_rate: null}), {trades: 0, net: 0, costs: 0});
  box.innerHTML = chip("", "전체", total) +
                  rows.map(r => chip(r.key, r.label, r)).join("");

  box.querySelectorAll(".srcchip").forEach(el => el.onclick = () => {
    srcFilter = el.dataset.src === srcFilter ? "" : el.dataset.src;
    refreshHistory();
  });
}

function renderRCurve(s) {
  const box = $("#rcurve");
  const curve = s?.r_curve ?? [];
  const missing = s?.r_missing ?? 0;

  if (!curve.length) {
    // 아직 없으면 없다고 말한다. 빈 곡선을 0 으로 그려 두면 "본전"으로 읽힌다.
    box.innerHTML = `<div class="empty">엔진이 청산한 거래가 쌓이면
      여기에 누적 R 곡선이 그려집니다.${
        missing ? `<br>손절가를 모르는 거래 ${missing}건은 빠집니다.` : ""}</div>`;
    return;
  }

  const ys = curve.map(p => p.cum_r);
  const last = ys[ys.length - 1];
  const lo = Math.min(0, ...ys), hi = Math.max(0, ...ys);
  const span = (hi - lo) || 1;
  const W = 100, H = 44, pad = 3;
  const y = v => H - pad - ((v - lo) / span) * (H - pad * 2);
  const pts = curve.map((p, i) =>
    `${((i / Math.max(1, curve.length - 1)) * W).toFixed(2)},${y(p.cum_r).toFixed(2)}`
  ).join(" ");

  box.innerHTML = `
    <div class="kv"><span>누적</span><span class="${last >= 0 ? "pos" : "neg"}">${
      last >= 0 ? "+" : ""}${last.toFixed(2)} R</span></div>
    <div class="kv"><span>거래</span><span>${curve.length}건</span></div>
    <div class="kv"><span>평균</span><span class="${last >= 0 ? "pos" : "neg"}">${
      last >= 0 ? "+" : ""}${(last / curve.length).toFixed(2)} R</span></div>
    <svg class="spark" style="height:44px" viewBox="0 0 ${W} ${H}"
         preserveAspectRatio="none">
      <line x1="0" y1="${y(0).toFixed(2)}" x2="${W}" y2="${y(0).toFixed(2)}"
            stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <polyline points="${pts}" fill="none" stroke="${
        last >= 0 ? "var(--up)" : "var(--down)"}"
        stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="sparknote">0 R 기준선 · 랏 크기와 무관한 판단의 질${
      missing ? ` · 손절가 미상 ${missing}건 제외` : ""}</div>`;
}

async function refreshHistory() {
  const days = $("#histdays").value;
  const mine = $("#onlyours").checked;
  let d;
  try {
    d = await api(`/api/fx/history?days=${days}&only_ours=${mine}` +
                  `&source=${encodeURIComponent(srcFilter)}&limit=200`);
  } catch (e) {
    $("#histsum").textContent = "내역을 읽지 못했습니다";
    $("#histwrap").innerHTML = `<div class="errbox" style="margin:10px 12px">${
      esc(e.message)}</div>`;
    return;
  }
  const s = d.summary;
  histSummary = s;          // 계좌 카드의 '오늘 실현' 이 이걸 쓴다
  // 엔진 성적과 남의 거래를 **절대 한 덩어리로 합치지 않는다.** 합치면
  // 엔진이 벌었는지 다른 앱이 벌었는지 알 수 없다.
  //
  // 두 번째 칸 이름이 "수동"이 아니라 "그 외"인 이유: 그 안에는 사람이 손으로
  // 낸 거래보다 **다른 봇이 낸 거래가 훨씬 많다.** "수동"이라고 써 두면
  // 보는 사람이 전부 자기 손거래로 읽는다 — 실제로 그렇게 읽혔다.
  $("#histsum").innerHTML =
    histBlock("엔진", s.ours) + " &nbsp;|&nbsp; " + histBlock("그 외", s.manual)
    + ` &nbsp;|&nbsp; <em>오늘</em> ${signed(s.realised_today)}`;

  renderSources(s.by_source);
  renderRCurve(s);

  if (!d.trades.length) {
    $("#histwrap").innerHTML =
      `<div class="empty" style="padding:10px 12px">${
        srcFilter ? "이 앱이 이 기간에 청산한 거래가 없습니다." :
        mine ? "엔진이 청산한 거래가 아직 없습니다." :
               "이 기간에 청산된 거래가 없습니다."}</div>`;
    return;
  }

  const rows = d.trades.map(t => {
    const r = (t.r_multiple === null || t.r_multiple === undefined)
              ? '<span style="color:var(--faint)">—</span>'
              : `<span class="${t.r_multiple >= 0 ? "pos" : "neg"}">${
                  t.r_multiple >= 0 ? "+" : ""}${t.r_multiple.toFixed(2)}</span>`;
    const held = t.held_minutes >= 1440
      ? (t.held_minutes / 1440).toFixed(1) + "일"
      : (t.held_minutes >= 60 ? (t.held_minutes / 60).toFixed(1) + "시간"
                              : t.held_minutes.toFixed(0) + "분");
    return `<tr class="${t.is_fx ? "fx" : ""} ${t.ours ? "mine" : ""}"
                ${t.is_fx ? `data-sym="${esc(t.display).replace("/", "")}"` : ""}>
      <td class="l">${esc(t.closed_at.slice(0, 16).replace("T", " "))}</td>
      <td class="l"><b>${esc(t.display)}</b></td>
      <td class="l"><span class="${t.side === "LONG" ? "pos" : "neg"}">${
        t.side === "LONG" ? "롱" : "숏"}</span></td>
      <td>${t.volume}</td>
      <td>${px(t.entry_price)}</td>
      <td>${px(t.exit_price)}</td>
      <td>${signed(t.profit)}</td>
      <td>${r}</td>
      <td>${esc(held)}</td>
      <td class="l">${t.regime ? esc(REGIME_KO[t.regime] ?? t.regime) : ""}</td>
      <td class="l">${stratLabel(t.strategies, t.group)}</td>
      <td class="l"><span class="src ${t.ours ? "mine" : ""} ${
        t.source && t.source.startsWith("magic") ? "unknown" : ""}">${
        esc(t.source_label || (t.ours ? "엔진" : "수동"))}</span>${
        // 연 앱과 닫은 앱이 다르면 밝힌다. 앱들이 서로의 포지션을 건드리고
        // 있다는 뜻이고, 손익을 **연 앱 성적**으로 세고 있으니 보여야 한다.
        t.closed_by ? `<span class="src unknown" title="${
          esc(t.source_label)} 가 연 포지션을 ${esc(t.closed_by)} 가 닫았다"
          style="margin-left:3px">→${esc(t.closed_by)}</span>` : ""}</td>
    </tr>`;
  }).join("");

  $("#histwrap").innerHTML = `<table class="hist">
    <thead><tr>
      <th class="l">청산</th><th class="l">종목</th><th class="l">방향</th>
      <th>수량</th><th>진입</th><th>청산</th><th>손익</th><th>R</th>
      <th>보유</th><th class="l">국면</th><th class="l">전략</th><th class="l">출처</th>
    </tr></thead><tbody>${rows}</tbody></table>` +
    (d.truncated ? `<div class="empty" style="padding:8px 12px">
       …그 밖에 ${d.truncated}건 더 있습니다.</div>` : "");

  // FX 거래를 누르면 차트가 그 종목으로 간다. 수동 선택이므로 엔진이 덮지 않는다.
  document.querySelectorAll("table.hist tr.fx").forEach(el => {
    el.onclick = async () => {
      applyFocus(await api(
        `/api/fx/focus?symbol=${el.dataset.sym}&manual=true`, {method: "POST"}));
    };
  });
}

/* ───────── 자동매매 엔진 ─────────
   이 신호는 FX 에서 우위가 확인되지 않았다. 화면이 그 판정을 지우면
   사용자는 검증된 것을 돌리고 있다고 착각한다. 버튼 위에 붙여 둔다. */
let engineBusy = false;

async function engineCall(path, group) {
  if (engineBusy) return;
  engineBusy = true;
  try {
    const st = await api(path + (group ? `?group=${group}` : ""), {method: "POST"});
    group === "short" ? renderShortEngine(st) : renderEngine(st);
  }
  catch (e) { $("#alerts").innerHTML =
    `<div class="errbox">${e.message}</div>`; }
  finally { engineBusy = false; }
}

/* **루프가 실제로 도는지 보여 준다.**

   예전에는 FX 쪽에 스케줄러가 아예 없어서 "시작"을 눌러도 아무 일이 없었다.
   플래그만 켜져 있고 매매는 한 건도 나가지 않는데 화면은 "작동 중"이라고
   말했다 — 고장 난 것처럼 보이지 않아서 더 나빴다. 그래서 확인 횟수와
   마지막 기준 봉을 같이 내보낸다. running 인데 여기가 안 늘면 죽은 것이다. */
function engineLoopRow(st) {
  if (!st.running) return "";
  const bad = !st.loop_alive;
  const bar = st.last_bar ? st.last_bar.slice(11, 16) : "—";
  return `
    <div class="enginerow"><span class="k">루프</span>
      <b style="color:${bad ? "var(--down)" : "var(--up)"}">${
        bad ? "죽었음 — 다시 시작하세요" :
        `살아있음 · ${st.poll_seconds}초마다 확인`}</b></div>
    <div class="enginerow"><span class="k">한 바퀴</span>
      <b>${st.cycles ?? 0}회 (확인 ${st.checks ?? 0}회)</b></div>
    <div class="enginerow"><span class="k">기준 봉</span><b>${bar} UTC</b></div>`;
}

function renderEngine(st) {
  if (!st) return;
  // **가드 값을 계좌 카드가 그대로 쓴다.** 화면이 따로 만든 숫자를 띄우면
  // 가드가 실제로 막는 시점과 어긋난다.
  guardState = st.guard || null;
  // 유튜브 카드가 발언권을 여기 실려 온 투표(signals[].votes)에서 읽는다
  engines.main = st;
  if (ytData && !ytBusy) renderYoutube(ytData);
  const box = $("#engine");
  const v = st.verdict || {};
  const killed = st.guard?.kill_switch;
  const on = st.running;

  const state = killed ? ["킬 스위치", "#f0616d"]
              : on ? ["작동 중", "#3fb950"]
              : ["정지", "var(--faint)"];

  const g = st.guard || {};
  box.innerHTML = `
    ${v.passed === false ? `<div class="verdict">
        <b>검증 미통과 — ${esc(v.headline || "")}</b><br>${esc(v.detail || "")}
      </div>` : ""}
    <div class="enginerow"><span class="k">상태</span>
      <b style="color:${state[1]}">${state[0]}</b></div>
    <div class="enginerow"><span class="k">주문 대상</span>
      <b>${st.allow_live ? "실계좌 허용됨" : "데모 전용"}</b></div>
    <div class="enginerow"><span class="k">봉</span><b>${esc(st.interval || "")}</b></div>
    ${engineLoopRow(st)}
    <div class="enginerow"><span class="k">감시 종목</span><b>${st.scanned ?? 0}</b></div>
    <div class="enginerow"><span class="k">오늘 실현</span>
      <b>${(g.realised_today ?? 0).toFixed(2)}</b></div>
    ${st.last_error ? `<div class="errbox">${esc(st.last_error)}</div>` : ""}
    <div class="btns">
      ${on ? `<button class="btn stop" onclick="engineCall('/api/fx/engine/stop')">정지</button>`
           : `<button class="btn go" onclick="engineCall('/api/fx/engine/start')"
                ${killed ? "disabled" : ""}>시작</button>`}
      <button class="btn" onclick="engineCall('/api/fx/engine/once')">한 바퀴</button>
      ${killed ? `<button class="btn" onclick="engineCall('/api/fx/engine/release')">킬 해제</button>`
               : `<button class="btn stop" onclick="engineCall('/api/fx/engine/kill')">킬 스위치</button>`}
      <button class="btn stop" onclick="engineCall('/api/fx/engine/flatten')">전량 청산</button>
    </div>
    ${(g.recent_blocks || []).length ? `<div style="margin-top:9px;font-size:11px;
        color:var(--faint);line-height:1.6">막힌 이유<br>${
        g.recent_blocks.slice(0, 3).map(b =>
          `· ${esc(b.symbol)} — ${esc(b.reason)}`).join("<br>")}</div>` : ""}`;
}

/* ───────── 유튜브 전략 ─────────
   URL 을 넣으면 서버가 자막을 받아 규칙을 뽑고 **꺼진 채로** 저장한다.
   내용을 보고 사람이 켠다 — 본 적 없는 규칙이 투표에 들어가면 안 된다.

   **켰다고 주문에 영향을 주는 것은 아니다.** 발언권은 엔진이 최근 학습 구간
   성적으로 정한다. 그래서 "켜짐"만 띄우지 않고 지난 바퀴에서 몇 종목에
   발언권이 있었는지를 같이 보여 준다. 0 이면 고장이 아니라 성적이 그렇다는 뜻이다.

   MT5 가 끊겨 있어도 이 카드는 따로 돈다. 전략을 분석하고 고르는 일은
   브로커 연결과 상관이 없다. */
let ytData = null, ytBusy = false;
const engines = {};          // 투표 군별 엔진 상태 (main, short)
const ytOpen = new Set();

/* ───────── 단기 자동매매 ─────────
   1시간봉 미만(5·15·30분) 유튜브 전략은 기본 군에 넣을 수 없다 — 1시간봉으로는
   그 조건을 계산할 수 없다. 그래서 **따로 투표하고 따로 진입·청산하는 군**을 둔다.
   시작·정지는 군마다 따로다. 킬 스위치와 전량 청산은 위쪽 카드의 것이 둘 다 멈춘다. */
function renderShortEngine(st) {
  if (!st) return;
  engines.short = st;
  if (ytData && !ytBusy) renderYoutube(ytData);
  const killed = st.guard?.kill_switch, on = st.running, idle = !st.interval;
  const state = killed ? ["킬 스위치", "#f0616d"]
              : on ? ["작동 중", "#3fb950"]
              : ["정지", "var(--faint)"];
  $("#shortengine").innerHTML = `
    <div class="enginerow"><span class="k">상태</span>
      <b style="color:${state[1]}">${state[0]}</b></div>
    <div class="enginerow"><span class="k">봉</span>
      <b>${idle ? "켜 둔 단기 전략 없음" : esc(st.interval)}</b></div>
    ${engineLoopRow(st)}
    <div class="enginerow"><span class="k">감시 종목</span><b>${st.scanned ?? 0}</b></div>
    <div class="enginerow"><span class="k">보유</span><b>${(st.held || []).length}</b></div>
    ${st.last_error ? `<div class="errbox">${esc(st.last_error)}</div>` : ""}
    <div class="btns">
      ${on ? `<button class="btn stop" onclick="engineCall('/api/fx/engine/stop', 'short')">정지</button>`
           : `<button class="btn go" onclick="engineCall('/api/fx/engine/start', 'short')"
                ${killed ? "disabled" : ""}>시작</button>`}
      <button class="btn" onclick="engineCall('/api/fx/engine/once', 'short')">한 바퀴</button>
    </div>
    <div class="ytnote">5·15·30분봉 유튜브 전략끼리만 투표하고, 기본 군과 따로
      진입·청산합니다. 켜 둔 단기 전략 중 가장 짧은 봉으로 돕니다. 킬 스위치와
      일일 손실 한도는 두 군이 함께 씁니다.</div>`;
}

function ytVoice(engineName, group) {
  const votes = (engines[group]?.signals || [])
    .map(s => (s.votes || []).find(v => v.strategy === engineName))
    .filter(Boolean);
  if (!votes.length) return null;
  return {voiced: votes.filter(v => v.has_voice).length, total: votes.length};
}

function ytRow(s) {
  const name = esc(s.strategy_name);
  const banned = (ytData.banned || []).includes(s.engine_name);
  const short = s.group === "short";
  const voice = s.enabled && !banned && s.group ? ytVoice(s.engine_name, s.group) : null;
  // 과거 검증에서 손실로 나온 전략은 켤 수 없다. 서버도 거부하고 엔진도 넣지 않는다.
  const [status, cls] =
      s.blocked ? ((s.validation?.net_r ?? 0) < 0 ? ["차단 · 과거 검증 손실", "bad"]
                   : s.validation ? ["차단 · 판정 불가", "warn"]
                   : [s.group ? "검증 후 켤 수 있음" : "적용 불가", "warn"])
    : !s.enabled ? [short ? "꺼짐 · 단기 군" : "꺼짐", ""]
    : banned ? ["금지목록에 있어 제외", "warn"]
    : !s.group ? ["적용 불가", "warn"]
    : voice && short ? [`단기 · 발언권 ${voice.voiced}/${voice.total}`, voice.voiced ? "on" : "warn"]
    : short ? ["켜짐 · 단기 군", "on"]
    : voice ? [`발언권 ${voice.voiced}/${voice.total} 종목`, voice.voiced ? "on" : "warn"]
    : ["켜짐 · 다음 바퀴부터", "on"];
  const inds = (s.indicators_needed || []).map(i => {
    const p = Object.entries(i.params || {}).map(([k, v]) => `${k}=${v}`).join(", ");
    return `${i.name}(${p})`;
  }).join(", ");
  const ex = s.exit_conditions || {};
  const exits = [
    ex.take_profit_pct != null ? `익절 ${(ex.take_profit_pct * 100).toFixed(2)}%` : "",
    ex.stop_loss_pct != null ? `손절 ${(ex.stop_loss_pct * 100).toFixed(2)}%` : "",
    ex.indicator_exit || "",
  ].filter(Boolean).join(" · ");
  // 저장 파일은 손으로 고칠 수 있다. 유튜브 주소가 아니면 링크로 만들지 않는다.
  const link = String(s.source_url || "").startsWith("https://www.youtube.com/watch?v=")
    ? `<a class="btn" href="${esc(s.source_url)}" target="_blank" rel="noopener">영상</a>` : "";
  return `
    <details class="yt" ${ytOpen.has(s.strategy_name) ? "open" : ""}
        ontoggle="this.open ? ytOpen.add('${name}') : ytOpen.delete('${name}')">
      <summary>
        <input type="checkbox" ${s.enabled && !s.blocked ? "checked" : ""}
               ${s.blocked ? "disabled" : ""}
               title="${s.blocked ? esc(s.block_reason || "켤 수 없습니다") : "투표에 넣기"}"
               onchange="ytToggle('${name}', this.checked)">
        <b title="${name}">${name}</b>
        ${s.validation && s.validation.net_r != null ? `<span class="ytst ${
          s.validation.net_r >= 0 ? "on" : "bad"}" title="과거 검증: 비용을 뺀 거래당 기대값 (${
          esc(s.validation.verdict)})">${rText(s.validation.net_r)}</span>` : ""}
        <span class="ytst ${cls}">${esc(status)}</span>
      </summary>
      <div class="ytbody">
        ${short ? `<div class="ytk"><b>단기 군</b>에서 ${esc(s.timeframe)}봉으로
          따로 투표합니다. 기존 전략과 섞이지 않고, 단기 군만의 포지션으로 따로
          진입·청산합니다. "단기 자동매매" 카드에서 시작해야 돕니다.</div>`
        : !s.group ? `<div class="warnbox">${esc(s.timeframe)}봉 전략은 적용할 수
          없습니다. 단기 군이 다루는 가장 짧은 봉은 5분봉입니다 — 1분봉은 MT5 가
          학습에 필요한 만큼 주지 않습니다. <b>켜도 투표하지 않습니다.</b></div>`
        : s.timeframe_mode === "resampled" ? `<div class="ytk">영상 기준
          <b>${esc(s.timeframe)}봉</b>으로 계산합니다 — 엔진의
          ${esc(ytData.engine_interval)}봉을 묶어서 보고, ${esc(s.timeframe)}봉이
          마감될 때만 판단이 바뀝니다.</div>`
        : !s.timeframe ? `<div class="ytk">영상이 시간봉을 말하지 않아 엔진 봉
          (${esc(ytData.engine_interval)})을 씁니다.</div>` : ""}
        <div class="ytk">롱 진입</div>
        <code>${esc(s.entry_conditions?.long || "(없음)")}</code>
        <div class="ytk">숏 진입</div>
        <code>${esc(s.entry_conditions?.short || "(없음)")}</code>
        <div class="ytk">지표 · ${esc(s.target_market)} · ${esc(s.timeframe || "봉 미언급")}</div>
        <div>${esc(inds || "(없음)")}</div>
        <div class="ytk">수치화한 가정</div>
        ${(s.quant_assumptions || []).length
          ? `<ul>${s.quant_assumptions.map(a => `<li>${esc(a)}</li>`).join("")}</ul>`
          : "<div>(없음)</div>"}
        <div class="ytk">영상의 청산 규칙 — 기록만, 엔진은 ATR 손절·목표를 씁니다</div>
        <div>${esc(exits || "(없음)")}</div>
        <div class="ytk">조건이 참이 된 뒤 ${ytData.hold_bars}봉(${esc(s.timeframe || ytData.engine_interval)}봉 기준) 동안 그 방향을 유지합니다</div>
        ${ytValidation(s)}
        <div class="btns">${link}
          <button class="btn" onclick="ytValidate('${name}')"
            ${ytJobRunning() || !s.group ? "disabled" : ""}>${s.validation ? "다시 검증" : "검증"}</button>
          <button class="btn stop" onclick="ytDelete('${name}')">삭제</button></div>
      </div>
    </details>`;
}

/* ───────── 과거 검증 ─────────
   전략을 켜기 전에 과거에 어땠는지 본다. 버튼을 누르면 서버가 **별도 프로세스에서
   낮은 우선순위로** 몇 분 동안 돌린다 — 같은 PC 의 엔진이 CPU 를 먼저 쓰게 하려는
   것이다. 한 번에 하나만 돈다.

   **비용을 뺀 숫자를 앞에 둔다.** 비용 전 성적은 "규칙에 우위가 있는가"이고 비용 후
   성적은 "돈이 되는가"다. 앞의 것만 보면 0 근처의 전략이 쓸 만해 보인다.

   연도별 숫자를 같이 띄운다. 평균이 좋아도 한두 해가 끌고 간 것이면 다른 이야기다.
   그리고 이 검증은 진입 조건만 본다 — 청산은 영상이 아니라 이 앱의 방식이다. */
const rText = v => `${v >= 0 ? "+" : ""}${Number(v).toFixed(3)}R`;

function ytJobRunning() { return ytData?.validation_job?.state === "running"; }

function ytValidation(s) {
  const job = ytData.validation_job || {};
  const mine = job.name === s.strategy_name;
  if (mine && job.state === "running") {
    return `<div class="ytk">과거 검증</div>
      <div>검증 중… ${job.done ?? 0}/${job.total || "?"} ${esc(job.symbol || "")}
        <span style="color:var(--faint)">— 몇 분 걸립니다. 엔진은 계속 돕니다.</span></div>`;
  }
  const failed = mine && job.state === "failed"
    ? `<div class="errbox" style="margin-top:6px">검증 실패: ${esc(job.error || "")}</div>` : "";
  const v = s.validation;
  if (!v) {
    return `<div class="ytk">과거 검증</div>
      <div style="color:var(--faint)">${s.group ? (s.blocked
          ? "아직 검증하지 않았습니다. 검증을 통과해야 켤 수 있습니다."
          : "아직 검증하지 않았습니다.")
        : "이 시간봉은 과거 데이터가 부족해 검증할 수 없습니다."}</div>${failed}`;
  }
  const head = `<div class="ytk">과거 검증 · ${esc(v.from)} ~ ${esc(v.to)} ·
    ${v.pairs}종목 · ${esc(v.interval)}봉</div>`;
  if (v.net_r == null) {
    return `${head}<div>거래 ${v.trades}건 — 판정하기에 너무 적습니다.</div>${failed}`;
  }
  const cls = x => x >= 0 ? "pos" : "neg";
  return `${head}
    <div><b class="${cls(v.net_r)}">${rText(v.net_r)}</b> 비용 후 ·
      <span class="${cls(v.gross_r)}">${rText(v.gross_r)}</span> 비용 전 ·
      <b>${esc(v.verdict)}</b>${v.t != null ? ` (t ${v.t.toFixed(1)})` : ""}</div>
    <div>거래 ${v.trades.toLocaleString()}건 · 연 ${v.per_year.toLocaleString()}건 ·
      승률 ${(v.win_rate * 100).toFixed(1)}% · 플러스 ${v.positive_pairs}/${v.pairs}종목</div>
    <div class="ytyears">${v.by_year.map(y => `<span class="${cls(y.r)}"
      title="${y.year}년 · ${y.trades}건">'${String(y.year).slice(2)} ${
      y.r >= 0 ? "+" : ""}${y.r.toFixed(2)}</span>`).join(" ")}</div>
    <div style="color:var(--faint);font-size:10.5px">진입 조건만 검증합니다. 청산은
      이 앱의 방식(손절 ${v.stop_mult}×ATR, 손익비 ${v.reward_ratio})입니다.</div>
    ${s.blocked && v.net_r < 0 ? `<div class="warnbox" style="margin-top:6px">비용 후 손실이라
      <b>투표에서 뺐고 켤 수 없습니다.</b> 영상을 다시 분석해 규칙이 바뀌면 검증
      결과가 지워지고 다시 켤 수 있습니다.</div>` : ""}${failed}`;
}

async function ytValidate(name) {
  try {
    await api(`/api/youtube/strategies/${encodeURIComponent(name)}/validate`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({confirm: true})});
    ytOpen.add(name);
    $("#ytmsg").innerHTML = "";
  } catch (e) { $("#ytmsg").innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
  await refreshYoutube();
}

let ytPoll = null;

function renderYoutube(d) {
  ytData = d;
  // 검증이 도는 동안만 목록을 다시 읽는다 — 진행 상황과 끝난 결과를 보이려고
  clearTimeout(ytPoll);
  if (d.validation_job?.state === "running") ytPoll = setTimeout(refreshYoutube, 5000);
  $("#ytkey").innerHTML = d.llm_ready ? "" : `<div class="warnbox">분석하려면
    GEMINI_API_KEY 또는 OPENAI_API_KEY 환경변수가 필요합니다. 설정한 뒤 서버를
    다시 시작하세요. 저장된 전략을 켜고 끄는 것은 키 없이도 됩니다.</div>`;
  $("#ytgo").disabled = ytBusy || !d.llm_ready;
  // 손실로 검증된 전략은 목록에 두지 않는다 — 켤 수도 없는 것이 쌓이면 쓸 만한
  // 후보가 묻힌다. 지우지는 않고 접힌 한 줄로 남긴다: 어떤 영상이 어떤 성적이었는지
  // 보여야 같은 영상을 다시 분석하지 않는다.
  const kept = d.archived || [];
  const job = d.validation_job || {};
  const moved = job.state === "done" && job.archived
    ? `<div class="ytnote"><b>${esc(job.name)}</b> — 검증 결과 손실(${
        job.net_r != null ? rText(job.net_r) : ""})이라 보관함으로 옮겼습니다.</div>` : "";
  const shelf = kept.length ? `<details class="yt"><summary>
      <b style="font-weight:400;color:var(--faint)">손실로 보관된 전략 ${kept.length}개</b>
    </summary><div class="ytbody">${kept.map(a => `<div>${esc(a.strategy_name)}
      <span class="neg">${a.net_r != null ? rText(a.net_r) : ""}</span>
      <span style="color:var(--faint)">${esc(a.timeframe || "")}봉 ·
        ${(a.trades ?? 0).toLocaleString()}건</span></div>`).join("")}
      <div style="color:var(--faint);font-size:10.5px;margin-top:4px">투표에 들어가지
        않습니다. 파일은 runs/youtube/archive 에 있습니다.</div></div></details>` : "";
  $("#ytlist").innerHTML = (d.strategies.length
    ? d.strategies.map(ytRow).join("")
    : `<div class="empty">저장된 전략이 없습니다.</div>`) + moved + shelf;
}

async function refreshYoutube() {
  try { renderYoutube(await api("/api/youtube/strategies")); }
  catch (e) { $("#ytlist").innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
}

async function ytExtract() {
  const url = $("#yturl").value.trim();
  if (!url || ytBusy) return;
  ytBusy = true;
  $("#ytgo").disabled = true;
  $("#ytmsg").innerHTML = `<div class="empty">분석 중… 자막을 받고 규칙을 뽑는 데
    수십 초 걸립니다.</div>`;
  try {
    const s = await api("/api/youtube/extract", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({url, overwrite: $("#ytover").checked})});
    ytOpen.add(s.strategy_name);
    $("#yturl").value = "";
    $("#ytmsg").innerHTML = `<div class="empty">저장했습니다 — <b>${esc(s.strategy_name)}</b>.
      꺼진 상태입니다. 내용을 확인하고 켜세요.</div>`;
  } catch (e) {
    $("#ytmsg").innerHTML = `<div class="errbox">${esc(e.message)}</div>`;
  } finally {
    ytBusy = false;
    await refreshYoutube();
  }
}

async function ytToggle(name, on) {
  try {
    await api(`/api/youtube/strategies/${encodeURIComponent(name)}/enable`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({on})});
    $("#ytmsg").innerHTML = "";
  } catch (e) { $("#ytmsg").innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
  await refreshYoutube();
}

async function ytDelete(name) {
  if (!confirm(`${name} 전략을 삭제할까요? 되돌릴 수 없습니다.`)) return;
  try {
    await api(`/api/youtube/strategies/${encodeURIComponent(name)}`, {method: "DELETE"});
    ytOpen.delete(name);
  } catch (e) { $("#ytmsg").innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
  await refreshYoutube();
}

/* ───────── 감시 통화쌍 ─────────
   기본은 이 브로커의 FX 쌍 전부다. 줄이고 싶을 때 여기서 고른다.
   전부 체크해서 저장하면 서버가 "전체"로 저장한다 — 브로커가 심볼을 추가해도
   따라 들어오게 하려는 것이다.

   **비용/1R 을 체크박스 옆에 둔다.** 종목을 고르는 자리에서 그 숫자가 안
   보이면 스프레드 넓은 교차 통화쌍을 모르고 넣게 된다. 호가를 아직 못 받은
   종목(지금 감시하지 않는 것)은 숫자가 비어 있다. */
let wlData = null, wlEditing = false, wlBusy = false;

async function refreshWatchlist() {
  try { wlData = await api("/api/fx/pairs"); renderWatchlist(); }
  catch (e) {
    $("#wlsum").textContent = "";
    $("#watchlist").innerHTML =
      `<div class="empty">MT5 에 연결되면 고를 수 있습니다.</div>`;
  }
}

function renderWatchlist(message) {
  const d = wlData;
  if (!d) return;
  const watched = d.pairs.filter(p => p.watched);
  $("#wlsum").textContent = d.all ? `전체 ${d.pairs.length}개`
                                  : `선택 ${watched.length} / ${d.pairs.length}개`;
  const box = $("#watchlist");
  if (!wlEditing) {
    box.innerHTML = `
      <div class="wlnames">${watched.map(p => esc(p.display)).join(" · ")}</div>
      <div class="btns"><button class="btn" onclick="wlEdit(true)">고르기</button></div>
      ${message ? `<div class="ytnote">${esc(message)}</div>` : ""}`;
    return;
  }
  const cost = Object.fromEntries(quotes.map(q => [q.canonical, q.cost_over_r_pct]));
  box.innerHTML = `
    <div class="wlgrid">${d.pairs.map(p => `
      <label><input type="checkbox" value="${esc(p.canonical)}"
                    ${p.watched ? "checked" : ""}> ${esc(p.display)}
        <span class="cost">${cost[p.canonical] != null ? cost[p.canonical] + "%" : ""}</span>
      </label>`).join("")}</div>
    <div class="btns">
      <button class="btn" onclick="wlCheck(true)">전체</button>
      <button class="btn" onclick="wlCheck(false)">해제</button>
      <button class="btn go" onclick="wlSave()" ${wlBusy ? "disabled" : ""}>저장</button>
      <button class="btn" onclick="wlEdit(false)">취소</button>
    </div>
    <div class="ytnote">숫자는 비용/1R 입니다. 다음 바퀴부터 반영됩니다. 목록에서
      빼도 그 종목에 열린 포지션은 닫지 않습니다 (손절·목표는 브로커에 걸려 있습니다).</div>
    ${message ? `<div class="errbox" style="margin-top:8px">${esc(message)}</div>` : ""}`;
}

function wlEdit(on) { wlEditing = on; renderWatchlist(); }

function wlCheck(on) {
  document.querySelectorAll("#watchlist .wlgrid input").forEach(el => el.checked = on);
}

async function wlSave() {
  if (wlBusy) return;
  const symbols = [...document.querySelectorAll("#watchlist .wlgrid input:checked")]
    .map(el => el.value);
  if (!symbols.length) { renderWatchlist("통화쌍을 하나 이상 고르세요."); return; }
  wlBusy = true;
  try {
    wlData = await api("/api/fx/watchlist", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({symbols})});
    wlEditing = false;
    renderWatchlist("저장했습니다. 엔진의 다음 바퀴부터 반영됩니다.");
    refresh();                       // 위쪽 호가 띠를 새 목록으로 다시 그린다
  } catch (e) {
    renderWatchlist(e.message);
  } finally { wlBusy = false; }
}

/* ───────── 갱신 ───────── */
async function refresh() {
  try {
    const s = await api("/api/fx/status");
    provider = s.provider || provider;
    renderStatus(s);
    if (s.connected) {
      const q = await api("/api/fx/quotes");
      quotes = q.quotes;
      if (!wlData) refreshWatchlist();   // MT5 가 뒤늦게 붙었을 때
      if (!window.__focus) {
        // 새로고침해도 엔진이 옮겨 둔 종목을 유지한다. 서버 쪽 선택을 먼저
        // 보지 않고 여기서 기본값을 밀어 넣으면, 신호가 난 종목으로 옮겨 둔
        // 차트가 페이지를 열 때마다 도로 튕겨 나간다.
        let f = s.focus?.symbol ? s.focus : null;
        if (!f) {
          const fxPos = s.positions.find(p => p.tradingview);
          const first = fxPos?.display?.replace("/", "") || quotes[0]?.canonical;
          if (first) f = await api(
            `/api/fx/focus?symbol=${first}&manual=false`, {method: "POST"});
        }
        if (f) applyFocus(f);
      } else { renderStrip(); renderDetail(); }
      try { renderEngine(await api("/api/fx/engine")); }
      catch (e) { /* 엔진이 죽어도 차트는 계속 봐야 한다 */ }
      try { renderShortEngine(await api("/api/fx/engine?group=short")); }
      catch (e) { /* 단기 군이 죽어도 기본 군 화면은 그대로여야 한다 */ }

      // 잔고 부가정보와 내역은 MT5 거래 내역을 훑어야 해서 느리다.
      // 5초마다 부르면 터미널을 붙잡아 시세 갱신이 밀린다. 15초로 둔다.
      if (tick % 3 === 0) { await refreshBalance(); renderAccount(s.account);
                            await refreshHistory(); }
    }
    tick++;
  } catch (e) {
    $("#alerts").innerHTML = `<div class="errbox">갱신 실패: ${e.message}</div>`;
  }
  clearTimeout(timer);
  timer = setTimeout(refresh, 5000);
}

refresh();
refreshYoutube();
refreshWatchlist();
</script>
</body>
</html>
