# ═══════════════════════════════════════════════════════════════
#  레짐 퀀트 — 설정
#
#  기본값은 **검증에서 가장 좋았던 조합**이다. 그 조합조차 판정이 1/5 다.
#
#      129종목 · 7,496 거래 · 2021-12~2026-08 · runs/maker-1h
#      총기대R +0.0260  군집 t 3.52 (p=0.0004)   ← 우위는 실재한다
#      순기대R +0.0106  군집 t 1.42 (p=0.154)    ← 0과 구분되지 않는다
#      비용이 총우위의 59% 를 먹는다
#      Deflated Sharpe 0.865 (기준 0.95)
#
#  **이 설정으로 실매매하지 마십시오.** '가장 좋았던 조합'은 여러 조합을 다 본
#  뒤에 고른 것이고, 그 선택 편향을 반영한 Deflated Sharpe 가 기준 미달이다.
#  주문 실행 기능은 코드에 아예 없다 — 신호 조회와 백테스트 전용이다.
# ═══════════════════════════════════════════════════════════════

# 데이터 시장. futures_um = USDT 마진 무기한선물(숏 가능), spot = 현물(롱 전용)
market: futures_um

# 대상 종목. 유동성 상위로 제한한다 — 얇은 종목은 슬리피지가 백테스트를 거짓말로 만든다
universe:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - BNBUSDT
  - XRPUSDT
  - DOGEUSDT
  - AVAXUSDT
  - LINKUSDT

# 검증에서 가장 좋았던 전략 하나. 129종목 단독 실행 기준이다.
# scripts/significance.py --derivatives --all-strategies 로 재확인할 수 있다.
#
#   테이커 흐름 추종   총기대R +0.0224 (t=3.97)  ← 13종 중 최고, 순기대R 유일 양수
#   EMA 크로스 + ADX   총기대R +0.0228 (t=2.69)
#   돈치안 채널 돌파   총기대R +0.0113 (t=1.35)  ← 유의하지 않다
#   평균회귀 계열 6종  유의한 음의 우위 (VWAP회귀 t=-4.49)
#
# 앙상블로 섞으면 약한 전략이 희석해서 순기대R 이 내려간다(129종목 0/5).
# 그래서 단독으로 둔다. 여러 전략을 쓰려면 목록에 추가하고 다시 검증할 것.
strategies:
  - taker_flow_momentum

timeframes:
  # 신호 계산용. 검증은 1시간봉으로 한다 — 5분봉은 비용이 1R의 27%를 먹는다.
  signal: ["1h"]
  # 참고용으로 유지 (하위 타임프레임 실험용)
  signal_candidates: ["5m", "15m", "1h"]
  # 봉 내부에서 손절과 목표 중 무엇이 먼저 닿았는지 판정하는 데 쓴다.
  # 이게 없으면 백테스터는 "손절이 먼저"라는 보수적 가정을 강제한다.
  execution: "1m"

backtest:
  # 2년(창 8개)에서 5.9년(창 32개)으로 확장했다.
  # 2년 표본에서는 최고 창 하나가 전체 수익의 116%를 차지해, 창별 편중이
  # 실제 문제인지 표본 부족 탓인지 판별할 수 없었다.
  # 2020-10 은 8종목 전부가 데이터를 갖는 공통 시작점이다
  # (SOL·AVAX 가 2020-09 상장으로 가장 늦다).
  # 2021 상승장 + 2022 하락장 + 이후를 포함해 레짐 다양성도 확보된다.
  start: "2020-10-01"
  end: "2026-08-31"
  initial_equity: 10000.0

  # 바이낸스 USDT-M **메이커** 수수료 0.02% (편도).
  #
  # 129종목 실측에서 메이커가 순기대R 을 +0.0040 → +0.0106 으로 2.6배 올렸고,
  # 비용/총우위를 86% → 59% 로 내렸다. 이 프로젝트에서 순우위를 움직인 유일한
  # 수단이다. (8종목에서는 역효과로 보였는데 규모에서 재현되지 않았다.)
  #
  # **주의**: 백테스트는 지정가가 항상 체결된다고 가정한다. 실제로는 가격이
  # 그쪽으로 왔을 때 체결되므로 **불리한 방향에서 더 잘 체결된다**(역선택).
  # 모멘텀 신호는 빠른 움직임에서 나오므로 이 효과가 크다. 실전 성과는 이보다
  # 나쁘고, 얼마나 나쁜지는 호가 데이터 없이 알 수 없다.
  # 테이커 기준으로 보려면 0.0004 로 바꾼다 (순기대R +0.0040 으로 떨어진다).
  fee_rate: 0.0002
  # 편도 슬리피지(베이시스포인트). 1.5bp = 0.015%
  slippage_bps: 1.5

  # walk-forward: 학습 6개월 → 검증 2개월씩 굴린다
  walk_forward:
    train_months: 6
    test_months: 2

risk:
  # 트레이드 1회당 계좌 리스크
  risk_per_trade: 0.01
  # 동시 보유 포지션 수
  max_positions: 1

  # 앙상블 진입 문턱. 확신도를 백분위로 캘리브레이션한 상태의 값이다
  # (0.85 = 자기 최근 신호 중 상위 15%).
  #
  # 캘리브레이션이 없으면 이 숫자가 전략마다 다른 뜻이 된다. 실측: 테이커 흐름
  # 전략의 확신도 중위가 0.104 라, 문턱 0.35 는 실질적으로 |z|>=0.80 을 요구해
  # 전략이 선언한 진입 조건(|z|>=0.15)과 5배 어긋났다. 신호 85~89% 가 설계
  # 의도와 무관하게 버려졌다.
  entry_threshold: 0.85

  # 손절 거리 = ATR × 계수.
  # 1.5 → 4.0 으로 올렸다. 비용이 1R에서 차지하는 비율을 내리기 위해서다
  # (1시간봉 BTC: 1.5x → 9.3%, 4.0x → 3.5%). 수익률을 맞추려고 고른 값이
  # 아니라 비용 구조상 정해지는 값이다.
  atr_stop_mult: 4.0

  # 목표 거리 = 손절 거리 × 계수 (손익비).
  # 2.0 → 1.5. OOS 샤프 실측: 1.0→0.333, 1.5→0.493, 2.0→0.420, 3.0→0.193.
  # 레짐별 적응형 청산(walk_forward(adaptive_exit=True))도 구현해 두었지만
  # 실측에서는 고정 1.5 가 더 나았다 (BTC 샤프 0.97 → 0.66).
  reward_ratio: 1.5
  # 일일 손실 한도. 넘으면 그날은 거래 중단
  daily_loss_limit: 0.03

# ═══════════════════════════════════════════════════════════════
#  FX — 이 앱의 본체
#
#  차트는 트레이딩뷰, 데이터·주문은 MT5. 암호화폐는 다루지 않는다.
#  (암호화폐 코드는 복기·백테스트용으로 남아 있다.)
#
#  **두 시세는 다르다.** 트레이딩뷰 FX_IDC 는 은행 간 집계고, MT5 는 우리가
#  실제로 체결하는 브로커 호가다. 차트 마커와 체결가가 몇 핍 어긋나는 것은
#  버그가 아니라 서로 다른 피드이기 때문이다.
# ═══════════════════════════════════════════════════════════════
fx:
  # 트레이딩뷰 차트 데이터 제공자. FX_IDC 가 가장 널리 무료로 열려 있다.
  tv_provider: "FX_IDC"
  interval: "1h"

  # ─────────────────────────────────────────────────────────────
  #  실계좌 허용. **기본값이 사람을 지킨다.**
  #
  #  false 이면 데모 계좌에만 주문이 나간다. MT5 터미널에는 실계좌가
  #  붙어 있을 수 있고, 이 전략은 FX 에서 아직 검증되지 않았다.
  #  (암호화폐에서도 총우위 t=3.5 는 실재했지만 비용을 빼면 t=1.4 였다.
  #   FX 는 스프레드가 더 넓다 — 실측 평균 비용/1R 10.9%.)
  #
  #  켜기 전에 데모에서 충분히 돌려 보세요.
  # ─────────────────────────────────────────────────────────────
  allow_live: false

  # 명목가 상한 (계좌 잔고 대비). FX 는 명목가가 잔고를 넘는 것이 정상이다 —
  # 0.1랏 EUR/USD 가 11,000 달러어치인데 1만 달러 계좌의 평범한 크기다.
  # 이 한도의 목적은 레버리지를 쓰는 것을 막는 게 아니라 **랏 계산 버그가
  # 레버리지 사고로 번지는 것**을 막는 것이다. 30배면 규제 상한 수준이고,
  # 정상적인 1% 리스크 사이징은 여기에 한참 못 미친다.
  max_leverage: 30.0

  # 진입 문턱. **암호화폐 값(0.85)을 그대로 쓰면 신호가 한 번도 안 나온다.**
  # 거기서는 taker_flow_momentum 한 전략이 가중치를 독식해 그 하나만 강하게
  # 말하면 합산 점수가 곧바로 높아졌다. FX 는 가중치가 서너 전략에 갈리고
  # (실측 0.41/0.18/0.41) 동시에 같은 방향으로 말하는 일이 드물다.
  # EUR/USD 203일 실측: |점수| 95분위 0.17, 0.85 돌파 0봉, 0.35 돌파 1.89%.
  #
  # 이 값은 수익률을 맞춰서 고른 게 아니라 **신호가 나오기는 하는 수준**이다.
  # 어떤 값도 이 신호를 수익성 있게 만들지 못한다 — 우위 자체가 없다.
  entry_threshold: 0.35

  # 확신도를 자기 최근 분포의 백분위로 바꿔 문턱과 뜻을 맞춘다.
  # 전략마다 확신도 스케일이 제각각이라 이걸 끄면 문턱이 전략마다 다른 것을
  # 요구하게 된다.
  calibrate_strength: true

  # ─────────────────────────────────────────────────────────────
  #  투표에서 빼는 전략. **허용목록이 아니라 금지목록이다** —
  #  새 전략은 기본으로 들어오고, 빼는 것만 여기에 이름을 적는다.
  #
  #  order_flow_fade 를 빼는 이유 (전략 docstring 에 근거가 다 있다)
  #    · flow_extension_fade 와 **사실상 같은 전략**이다. 포지션을 원한
  #      572봉 중 겹치는 493봉에서 방향이 100% 일치했다(신호 상관 0.604).
  #      ad_line·cmf 가 이미 '거래량 x 종가위치' 누적이고 ofi_delta 가 같은
  #      구성이라 당연한 결과다 — 기존 지표를 다시 만든 것이다.
  #    · IC 의 약 2/3 이 단기 반전이고, 그 반전은 이미 세 전략
  #      (range_position_fade / vwap_reversion / bollinger_reversion)이 거래한다.
  #    · 틱으로 해상도를 올려도 나아지지 않았다 (1,117만 틱, IC -0.018).
  #
  #  **중복 투표는 무해하지 않다.** 쌍둥이와 동시에 자격을 얻으면 같은
  #  아이디어에 표가 두 장 가고 전략당 상한 0.45 를 우회해 0.90 까지 실린다.
  #  2026-09-15 실측에서 GBPUSD 가 정확히 그 상태였다
  #  (order_flow_fade 0.329 + flow_extension_fade 0.222).
  #
  #  2026-10-21 실측에서는 USDJPY 에서 **이 전략 홀로 가중치 1.000** 이었다.
  #  기대R 이 음수로 기록된 전략이 그 통화쌍의 판단을 혼자 쥐고 있었다는 뜻이다.
  #  빼면 USDJPY 는 자격 있는 전략이 0 개가 되어 거래하지 않는다 — 우위가
  #  확인되지 않은 통화쌍에서는 그게 맞는 결과다.
  # ─────────────────────────────────────────────────────────────
  exclude_strategies:
    - order_flow_fade

  # 관심 통화쌍. 비워 두면 주요 통화쌍 전부.
  #
  # **스프레드가 좁은 것부터 고르는 것이 맞다.** 이 프로젝트는 암호화폐에서
  # "우위는 실재하는데 비용이 그 59%를 먹어서 순우위가 0" 이라는 결론에 도달했다.
  # FX 는 스프레드가 더 넓어 그 비율이 더 크다 — 실측 평균 비용/1R 이 10.9% 였다.
  # 화면의 '비용/1R' 을 보고 고르세요.
  symbols:
    - EURUSD
    - GBPUSD
    - USDJPY
    - AUDUSD
    - USDCHF
    - EURJPY
    - EURGBP

# ═══════════════════════════════════════════════════════════════
#  자동매매 실행
#
#  **기본은 테스트넷이다.** 실전으로 바꾸려면 testnet 을 false 로 두고
#  config/secrets.yaml 의 live 블록에 실전 키를 따로 넣어야 한다.
#  기본값이 실전이면 실수 한 번이 돈이 된다.
#
#  실전으로 넘어가기 전에 확인할 것
#    · 테스트넷에서 며칠 돌려 체결·거부·재시작을 다 겪어 봤는가
#    · 손절이 매번 거래소에 걸리는지 주문 내역에서 확인했는가
#    · 킬 스위치와 전량 청산이 실제로 동작하는지 눌러 봤는가
#    · 검증 판정이 1/5 라는 사실을 감수하는가
# ═══════════════════════════════════════════════════════════════
execution:
  testnet: true

  # 동시에 몇 종목까지 들고 갈지
  max_positions: 3
  # 한 종목 명목가 상한 (계좌 대비). 수량 계산 버그가 레버리지 사고로
  # 번지는 것을 막는다. 1.0 = 레버리지 1배 상당.
  max_notional_ratio: 1.0
  # 분당 주문 상한. 루프가 폭주해도 여기서 걸린다.
  max_orders_per_minute: 6
  # 이 잔고 아래로 내려가면 진입하지 않는다 (USDT)
  min_balance: 20.0

# 실시간 신호 설정 (scripts/signals.py). 주문 기능은 없다.
live:
  interval: "1h"
  # 확신도를 자기 최근 분포의 백분위로 바꾼다 — 문턱이 같은 뜻을 갖게 한다
  calibrate_strength: true
  entry_threshold: 0.85
  # 비워 두면 위의 universe 를 쓴다. 129종목 전체를 보려면
  # scripts/signals.py --universe runs/universe_final.json
  symbols: []

# 유튜브 전략 — 영상에서 뽑은 진입 규칙을 FX 엔진의 투표에 넣는다.
# (FX 상황판의 "유튜브 전략" 카드, scripts/youtube_strategy.py)
#
# 켠 전략도 발언권은 최근 학습 구간 성적이 정한다. 빼고 싶은 전략은 화면에서
# 끄거나 fx.exclude_strategies 에 yt_<이름> 을 적는다.
# API 키는 여기 적지 않는다 — 환경변수 GEMINI_API_KEY 또는 OPENAI_API_KEY.
youtube:
  # 전략 하나가 JSON 파일 하나. runs/ 는 git 에서 제외된다.
  dir: "runs/youtube"
  gemini_model: "gemini-3.8-flash"
  openai_model: "gpt-4o-mini"
  whisper_model: "whisper-1"

# 실전 투입 합격 기준. out-of-sample 구간에서 전부 통과해야 페이퍼로 넘어간다
acceptance:
  min_sharpe: 1.0
  max_drawdown: 0.20
  min_trades: 100
  min_profit_factor: 1.3

paths:
  # **상대경로로 둔다.** 절대경로를 저장소에 박으면 받는 쪽에서 바로 깨진다.
  # 데이터를 다른 드라이브에 두려면 두 가지 방법이 있다.
  #   · 환경변수  REGIME_QUANT_DATA=D:/regime-quant-data
  #   · config/local.yaml 에 paths 만 덮어쓰기 (git 에서 제외됨)
  # 1분봉이 종목당 90MB 라 129종목이면 16GB 다 — 용량을 먼저 확인할 것.
  data_dir: "data"
  klines_dir: "data/klines"
  derivatives_dir: "data/derivatives"
  runs_dir: "runs"
