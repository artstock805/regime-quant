# ═══════════════════════════════════════════════════════════════
#  레짐 퀀트 — 설정
#
#  기본값은 **검증에서 가장 좋았던 조합**이다. 그 조합조차 판정이 1/5 다.
#
#      129종목 · 7,496 거래 · 2021-12~2026-08 · runs/maker-1h
#      총기대R +0.0260  군집 t 3.52 (p=0.0004)   ← 우위는 실재한다
#      순기대R +0.0106  군집 t 1.42 (p=0.154)    ← 0과 구분되지 않는다
#      비용이 총우위의 59% 를 먹는다
#      Deflated Sharpe 0.865 (기준 0.95)
#
#  **이 설정으로 실매매하지 마십시오.** '가장 좋았던 조합'은 여러 조합을 다 본
#  뒤에 고른 것이고, 그 선택 편향을 반영한 Deflated Sharpe 가 기준 미달이다.
#  주문 실행 기능은 코드에 아예 없다 — 신호 조회와 백테스트 전용이다.
# ═══════════════════════════════════════════════════════════════

# 데이터 시장. futures_um = USDT 마진 무기한선물(숏 가능), spot = 현물(롱 전용)
market: futures_um

# 대상 종목. 유동성 상위로 제한한다 — 얇은 종목은 슬리피지가 백테스트를 거짓말로 만든다
universe:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - BNBUSDT
  - XRPUSDT
  - DOGEUSDT
  - AVAXUSDT
  - LINKUSDT

# 검증에서 가장 좋았던 전략 하나. 129종목 단독 실행 기준이다.
# scripts/significance.py --derivatives --all-strategies 로 재확인할 수 있다.
#
#   테이커 흐름 추종   총기대R +0.0224 (t=3.97)  ← 13종 중 최고, 순기대R 유일 양수
#   EMA 크로스 + ADX   총기대R +0.0228 (t=2.69)
#   돈치안 채널 돌파   총기대R +0.0113 (t=1.35)  ← 유의하지 않다
#   평균회귀 계열 6종  유의한 음의 우위 (VWAP회귀 t=-4.49)
#
# 앙상블로 섞으면 약한 전략이 희석해서 순기대R 이 내려간다(129종목 0/5).
# 그래서 단독으로 둔다. 여러 전략을 쓰려면 목록에 추가하고 다시 검증할 것.
strategies:
  - taker_flow_momentum

timeframes:
  # 신호 계산용. 검증은 1시간봉으로 한다 — 5분봉은 비용이 1R의 27%를 먹는다.
  signal: ["1h"]
  # 참고용으로 유지 (하위 타임프레임 실험용)
  signal_candidates: ["5m", "15m", "1h"]
  # 봉 내부에서 손절과 목표 중 무엇이 먼저 닿았는지 판정하는 데 쓴다.
  # 이게 없으면 백테스터는 "손절이 먼저"라는 보수적 가정을 강제한다.
  execution: "1m"

backtest:
  # 2년(창 8개)에서 5.9년(창 32개)으로 확장했다.
  # 2년 표본에서는 최고 창 하나가 전체 수익의 116%를 차지해, 창별 편중이
  # 실제 문제인지 표본 부족 탓인지 판별할 수 없었다.
  # 2020-10 은 8종목 전부가 데이터를 갖는 공통 시작점이다
  # (SOL·AVAX 가 2020-09 상장으로 가장 늦다).
  # 2021 상승장 + 2022 하락장 + 이후를 포함해 레짐 다양성도 확보된다.
  start: "2020-10-01"
  end: "2026-08-31"
  initial_equity: 10000.0

  # 바이낸스 USDT-M **메이커** 수수료 0.02% (편도).
  #
  # 129종목 실측에서 메이커가 순기대R 을 +0.0040 → +0.0106 으로 2.6배 올렸고,
  # 비용/총우위를 86% → 59% 로 내렸다. 이 프로젝트에서 순우위를 움직인 유일한
  # 수단이다. (8종목에서는 역효과로 보였는데 규모에서 재현되지 않았다.)
  #
  # **주의**: 백테스트는 지정가가 항상 체결된다고 가정한다. 실제로는 가격이
  # 그쪽으로 왔을 때 체결되므로 **불리한 방향에서 더 잘 체결된다**(역선택).
  # 모멘텀 신호는 빠른 움직임에서 나오므로 이 효과가 크다. 실전 성과는 이보다
  # 나쁘고, 얼마나 나쁜지는 호가 데이터 없이 알 수 없다.
  # 테이커 기준으로 보려면 0.0004 로 바꾼다 (순기대R +0.0040 으로 떨어진다).
  fee_rate: 0.0002
  # 편도 슬리피지(베이시스포인트). 1.5bp = 0.015%
  slippage_bps: 1.5

  # walk-forward: 학습 6개월 → 검증 2개월씩 굴린다
  walk_forward:
    train_months: 6
    test_months: 2

risk:
  # 트레이드 1회당 계좌 리스크
  risk_per_trade: 0.01
  # 동시 보유 포지션 수
  max_positions: 1

  # 앙상블 진입 문턱. 확신도를 백분위로 캘리브레이션한 상태의 값이다
  # (0.85 = 자기 최근 신호 중 상위 15%).
  #
  # 캘리브레이션이 없으면 이 숫자가 전략마다 다른 뜻이 된다. 실측: 테이커 흐름
  # 전략의 확신도 중위가 0.104 라, 문턱 0.35 는 실질적으로 |z|>=0.80 을 요구해
  # 전략이 선언한 진입 조건(|z|>=0.15)과 5배 어긋났다. 신호 85~89% 가 설계
  # 의도와 무관하게 버려졌다.
  entry_threshold: 0.85

  # 손절 거리 = ATR × 계수.
  # 1.5 → 4.0 으로 올렸다. 비용이 1R에서 차지하는 비율을 내리기 위해서다
  # (1시간봉 BTC: 1.5x → 9.3%, 4.0x → 3.5%). 수익률을 맞추려고 고른 값이
  # 아니라 비용 구조상 정해지는 값이다.
  atr_stop_mult: 4.0

  # 목표 거리 = 손절 거리 × 계수 (손익비).
  # 2.0 → 1.5. OOS 샤프 실측: 1.0→0.333, 1.5→0.493, 2.0→0.420, 3.0→0.193.
  # 레짐별 적응형 청산(walk_forward(adaptive_exit=True))도 구현해 두었지만
  # 실측에서는 고정 1.5 가 더 나았다 (BTC 샤프 0.97 → 0.66).
  reward_ratio: 1.5
  # 일일 손실 한도. 넘으면 그날은 거래 중단
  daily_loss_limit: 0.03

# 실시간 신호 설정 (scripts/signals.py). 주문 기능은 없다.
live:
  interval: "1h"
  # 확신도를 자기 최근 분포의 백분위로 바꾼다 — 문턱이 같은 뜻을 갖게 한다
  calibrate_strength: true
  entry_threshold: 0.85
  # 비워 두면 위의 universe 를 쓴다. 129종목 전체를 보려면
  # scripts/signals.py --universe runs/universe_final.json
  symbols: []

# 실전 투입 합격 기준. out-of-sample 구간에서 전부 통과해야 페이퍼로 넘어간다
acceptance:
  min_sharpe: 1.0
  max_drawdown: 0.20
  min_trades: 100
  min_profit_factor: 1.3

paths:
  # **상대경로로 둔다.** 절대경로를 저장소에 박으면 받는 쪽에서 바로 깨진다.
  # 데이터를 다른 드라이브에 두려면 두 가지 방법이 있다.
  #   · 환경변수  REGIME_QUANT_DATA=D:/regime-quant-data
  #   · config/local.yaml 에 paths 만 덮어쓰기 (git 에서 제외됨)
  # 1분봉이 종목당 90MB 라 129종목이면 16GB 다 — 용량을 먼저 확인할 것.
  data_dir: "data"
  klines_dir: "data/klines"
  derivatives_dir: "data/derivatives"
  runs_dir: "runs"
